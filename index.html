<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kiya Hsieh — 數據架構師</title>
<meta name="description" content="Kiya Hsieh 的個人主頁與作品集：數據架構、大數據平台與 AI 自動化。">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="nav container">
    <a href="#home" class="logo">Kiya Hsieh</a>
    <button class="nav-toggle" id="navToggle" data-i18n-aria="nav.menu" aria-label="打開選單" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="#about" data-i18n="nav.about">關於</a></li>
      <li><a href="#projects" data-i18n="nav.projects">作品</a></li>
      <li><a href="#skills" data-i18n="nav.skills">技能</a></li>
      <li><a href="#contact" data-i18n="nav.contact">聯絡</a></li>
    </ul>
    <select class="lang-select" id="langSelect" aria-label="Language">
      <option value="zh-Hant">繁</option>
      <option value="zh-Hans">简</option>
      <option value="en">EN</option>
    </select>
    <button class="theme-toggle" id="themeToggle" data-i18n-aria="theme" data-i18n-title="theme" aria-label="切換主題" title="切換深/淺色">
      <span class="icon-sun">☀</span><span class="icon-moon">☾</span>
    </button>
  </nav>
</header>

<main>

  <section id="home" class="hero container">
    <p class="eyebrow" data-i18n="hero.eyebrow">你好，我是</p>
    <h1 data-i18n="hero.name">Kiya Hsieh</h1>
    <p class="hero-tagline" data-i18n="hero.tagline">數據架構師 · 大數據平台 · AI 自動化</p>
    <div class="hero-actions">
      <a href="#projects" class="btn btn-primary" data-i18n="hero.viewWork">查看作品</a>
      <a href="#contact" class="btn btn-ghost" data-i18n="hero.contact">聯絡我</a>
    </div>
  </section>

  <section id="about" class="section container">
    <h2 class="section-title"><span data-i18n="about.title">關於我</span></h2>
    <p class="about-text" data-i18n="about.text">數據架構師，專注於大數據平台、即時分析與 AI 自動化。這裡整理我公開的開源作品與小工具；想了解完整經歷，歡迎到 LinkedIn 找我。</p>
  </section>

  <section id="projects" class="section container">
    <h2 class="section-title"><span data-i18n="projects.title">作品 / 專案</span></h2>
    <div class="project-tools" id="projectTools" hidden>
      <div class="project-search">
        <input type="search" id="projectSearch" class="search-input" autocomplete="off" spellcheck="false"
               data-i18n-placeholder="projects.search" data-i18n-aria="projects.search" placeholder="搜尋作品、標籤…" aria-label="搜尋作品、標籤…">
        <kbd aria-hidden="true">/</kbd>
      </div>
      <div class="chip-row" id="categoryChips" role="group" data-i18n-aria="projects.category" aria-label="分類"></div>
      <div class="chip-row chip-row-tags" id="tagChips" role="group" data-i18n-aria="projects.tags" aria-label="標籤"></div>
      <div class="project-status">
        <span id="projectCount" aria-live="polite"></span>
        <button type="button" class="link-button" id="projectClear" data-i18n="projects.clear" hidden>清除篩選</button>
      </div>
    </div>
    <div class="project-grid" id="projectGrid"></div>
  </section>

  <section id="skills" class="section container">
    <h2 class="section-title"><span data-i18n="skills.title">技能</span></h2>
    <div class="skills-grid" id="skillsGrid"></div>
  </section>

  <section id="contact" class="section container">
    <h2 class="section-title"><span data-i18n="contact.title">聯絡</span></h2>
    <p class="contact-text" data-i18n="contact.text">歡迎透過 LinkedIn 聯絡我。</p>
    <div class="contact-links">
      <a href="https://linkedin.com/in/kiya326" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </section>

</main>

<footer class="site-footer container">
  <p>&copy; <span id="year"></span> Kiya Hsieh. <span data-i18n="footer">以純 HTML/CSS/JS 打造，託管於 GitHub Pages。</span></p>
</footer>

<script src="js/main.js"></script>
</body>
</html>
