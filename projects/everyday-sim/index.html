<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生活模拟实验室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 布局：左侧模型树 + 顶部视图 tab（右侧中英切换）+ 内容。配色取自工程图纸：蓝灰底、深墨线、橙色表示"正在发生" */
:root{
  color-scheme:light;
  --bg:#f3f5f7; --panel:#ffffff; --ink:#1b2430; --muted:#5d6977; --line:#d9dfe6; --soft:#eaeef2;
  --accent:#1f5f99; --accent-soft:#e3edf7; --live:#d9822b; --live-soft:#fbeedd;
  --good:#2b7a4b; --bad:#b23a3a;
  --p1:#1f5f99; --p2:#d9822b; --p3:#2b7a4b; --p4:#8a4fc0; --p5:#b23a3a; --p6:#5b6a7a;
  --f-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161c; --panel:#18202a; --ink:#e3e9ef; --muted:#9aa7b4; --line:#2a3542; --soft:#202a35;
  --accent:#7fb2e5; --accent-soft:#1c2c3d; --live:#f0a25a; --live-soft:#3a2a18;
  --good:#62c98b; --bad:#ef8080;
  --p1:#7fb2e5; --p2:#f0a25a; --p3:#62c98b; --p4:#c39af0; --p5:#ef8080; --p6:#a8b4c0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --panel:#18202a; --ink:#e3e9ef; --muted:#9aa7b4; --line:#2a3542; --soft:#202a35;
  --accent:#7fb2e5; --accent-soft:#1c2c3d; --live:#f0a25a; --live-soft:#3a2a18;
  --good:#62c98b; --bad:#ef8080;
  --p1:#7fb2e5; --p2:#f0a25a; --p3:#62c98b; --p4:#c39af0; --p5:#ef8080; --p6:#a8b4c0; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-body)}
[hidden]{display:none!important}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:18px 12px 24px max(14px,env(safe-area-inset-left,0px))}
.brand{font-weight:700;font-size:16px;margin:0}
.sub{font-size:12px;color:var(--muted);margin:2px 0 12px}
.tree{list-style:none;padding:0;margin:0;font-size:14px}
.tree ul{list-style:none;margin:0 0 0 9px;padding-left:12px;border-left:1px dashed var(--line)}
.tree button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:6px;align-items:center;width:100%;padding:3px 6px;border-radius:6px}
.tree button:hover{background:var(--soft)}
.tree button:focus-visible{outline:2px solid var(--accent)}
.tree button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tree .car{width:11px;font-size:9px;color:var(--muted);flex:none;transition:transform .15s}
.tree li.closed>ul{display:none}
.tree li.closed>button .car{transform:rotate(-90deg)}
.mtag{font:600 10px/1 var(--f-mono);padding:3px 5px;border-radius:4px;background:var(--soft);color:var(--muted);flex:none}
main{min-width:0;padding-block:0 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:flex-end;gap:8px}
.tabs{display:flex;gap:2px;overflow-x:auto;padding-top:10px;flex:1;min-width:0}
.tabs button{all:unset;cursor:pointer;white-space:nowrap;padding:8px 14px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.menu{display:none}
.lang{all:unset;cursor:pointer;flex:none;display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px;font-size:13px;background:var(--panel)}
.lang span{padding:4px 10px;color:var(--muted)}
.lang span.on{background:var(--accent);color:var(--panel);font-weight:700}
.lang:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.pane{max-width:1060px;padding-top:20px}
h1{font-size:clamp(22px,3.2vw,28px);line-height:1.25;margin:0 0 4px;text-wrap:balance}
h2{font-size:18px;margin:26px 0 10px}
.q{color:var(--muted);margin:0 0 14px;max-width:70ch}
.q::before{content:attr(data-q);color:var(--ink);font-weight:700}
.note{background:var(--live-soft);border-radius:8px;padding:8px 12px;font-size:14px;margin:10px 0}
.fig{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;margin:12px 0}
.fig svg{display:block;height:auto}
.fig canvas{display:block;max-width:100%}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.ctrl input[type=range]{flex:1;min-width:160px;accent-color:var(--accent)}
.clock{font:600 14px var(--f-mono);min-width:120px;font-variant-numeric:tabular-nums}
.btn{all:unset;cursor:pointer;background:var(--accent);color:var(--panel);padding:7px 14px;border-radius:8px;font-weight:700;font-size:14px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
select{font:14px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:12px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.kpi span{display:block;font-size:13px;color:var(--muted)}
.kpi b{display:block;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi b small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.ins{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:0 10px 10px 0;padding:10px 16px;margin:12px 0}
.ins ul{margin:4px 0;padding-left:20px}
.ins p{margin:0;font-size:12px;color:var(--muted)}
.wi{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
.sliders{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.sl{margin:10px 0}
.sl label{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.sl label b{font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.sl label b.chg{color:var(--live)}
.sl input{width:100%;accent-color:var(--accent)}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--good);font-weight:700}.down{color:var(--bad);font-weight:700}.flat{color:var(--muted)}
.method{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.method b{white-space:nowrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.cols>div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:0}
.cols h3{margin:0 0 6px;font-size:15px}
.cols ul{margin:0;padding-left:20px}
textarea{width:100%;min-height:130px;font:15px/1.6 var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical}
textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.status{font-size:13px;color:var(--muted)}
.fb{list-style:none;padding:0}
.fb li{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0}
.fb small{font:12px var(--f-mono);color:var(--muted)}
.about{max-width:760px}
svg text{font-family:var(--f-body)}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.25);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  aside.open{transform:none}
  .menu{display:inline-block;all:unset;cursor:pointer;padding:8px 10px;color:var(--accent);font-weight:700;flex:none}
  .wi{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
</style>
</head>

    for (const id of svc) {
      const x = B[id];

      k["util_" + id] = (x.bArea / (H * x.cap)) * 100;
      k["maxq_" + id] = x.maxQ;
      k["avgq_" + id] = x.qArea / H;
      k["balk_" + id] = x.balked;

  /* ---------- SD ---------- */
  function topo(items, known) {

  function runSD(spec, env0) {
    const H = +spec.time.horizon, dt = +(spec.time.dt || 1), G = grid(spec);
    const env = Object.assign({ t: 0, dt }, env0);
    const stocks = spec.stocks.map((s) => ({ id: s.id, init: compile(s.initial), min: s.min }));
    stocks.forEach((s) => (env[s.id] = s.init(env)));
    const flows = (spec.flows || []).map((f) => ({ id: f.id, from: f.from, to: f.to, f: compile(f.rate) }));
    const aux = topo((spec.aux || []).map((a) => ({ id: a.id, f: compile(a.expr) })), Object.keys(env));
    const names = stocks.map((s) => s.id).concat(flows.map((f) => f.id), aux.map((a) => a.id));
    const series = {}; names.forEach((n) => (series[n] = []));
    const evalAll = () => { aux.forEach((a) => (env[a.id] = a.f(env))); flows.forEach((f) => (env[f.id] = f.f(env))); aux.forEach((a) => (env[a.id] = a.f(env))); };

  /* ---------- ABM ---------- */
  function runABM(spec, env0, seed, record) {

      for (let j = 0; j < n; j++) st[pos++] = idx[sid];

    for (let i = N - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [st[i], st[j]] = [st[j], st[i]]; }
    const tr = spec.transitions.map((x) => ({ from: idx[x.from], to: idx[x.to], type: x.type || "rate",
      rate: x.rate != null ? compile(x.rate) : null, contacts: x.contacts != null ? compile(x.contacts) : null,
      prob: x.prob != null ? compile(x.prob) : null, withS: x.with != null ? idx[x.with] : null }));
    tr.forEach((x, i) => { if (x.from == null || x.to == null) throw new Error("状态转换引用了不存在的状态: " + JSON.stringify(spec.transitions[i])); });
    const series = {}; S.forEach((s) => (series[s] = []));

    const counts = () => { const c = new Array(S.length).fill(0); for (let i = 0; i < N; i++) c[st[i]]++; return c; };
    let gi = 0;

      env.t = s * dt;
      const c = counts();

  /* ---------- KPIs, replications ---------- */
  function seriesKpi(def, run, env) {

      out.push({ id: "util_" + b.id, label: L2(b, "忙碌程度", "how busy"), unit: "%", good: "mid", digits: 0 });

    }
    out.push({ id: "throughput", label: { zh: "完成服务", en: "Served" }, unit: ppl, good: "high", digits: 0 });

      const cols = runs[0].series[name].map((_, i) => runs.map((rn) => rn.series[name][i]));

    refs.stocks[s.id]={fill:el("rect",{x:x+2,y:238,width:TW-4,height:0,rx:4,fill:V("accent"),opacity:.75},svg),x};
    el("text",{x:x+TW/2,y:60,"text-anchor":"middle","font-size":14,"font-weight":700,fill:V("ink")},svg,tx(s.label)||s.id);
    refs.stocks[s.id].t=el("text",{x:x+TW/2,y:160,"text-anchor":"middle","font-size":17,"font-weight":700,fill:V("ink")},svg,live?"":t("stock"))});
  const idx=Object.fromEntries(S.map((s,i)=>[s.id,i]));let inN={},outN={};
  F.forEach(f=>{const ti=f.to!=null?idx[f.to]:null,fi=f.from!=null?idx[f.from]:null;let x1,y1,x2,y2,ly;
    if(fi!=null&&ti!=null){x1=sx(fi)+TW;x2=sx(ti);y1=y2=150;ly=140}else if(ti!=null){const k=inN[ti]=(inN[ti]||0)+1;x1=sx(ti)-80;x2=sx(ti);y1=y2=90+k*48;ly=y1-8;el("circle",{cx:x1-8,cy:y1,r:8,fill:"none",stroke:V("muted"),"stroke-dasharray":"2 2"},svg)}
    else{const k=outN[fi]=(outN[fi]||0)+1;x1=sx(fi)+TW;x2=x1+80;y1=y2=90+k*48;ly=y1-8;el("circle",{cx:x2+8,cy:y2,r:8,fill:"none",stroke:V("muted"),"stroke-dasharray":"2 2"},svg)}
    el("line",{x1,y1,x2:x2-2,y2,stroke:V("accent"),"stroke-width":3,"marker-end":AR},svg);el("polygon",{points:`${(x1+x2)/2-6},${y1-6} ${(x1+x2)/2+6},${y1-6} ${(x1+x2)/2},${y1}`,fill:V("accent")},svg);
    el("text",{x:(x1+x2)/2,y:ly-6,"text-anchor":"middle","font-size":12,fill:V("ink")},svg,tx(f.label)||f.id);refs.flows[f.id]=el("text",{x:(x1+x2)/2,y:y1+18,"text-anchor":"middle","font-size":11,fill:V("muted")},svg,"")});
  (m.aux||[]).forEach((a,i)=>el("text",{x:20,y:H-12-i*16,"font-size":11,fill:V("muted")},svg,t("auxLbl")+(tx(a.label)||a.id)));
  return refs}
function abmSvg(host,m){host.innerHTML="";const S=m.states,W=Math.max(600,S.length*220),H=230;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,width:"100%",style:`min-width:520px;max-width:${W}px`,role:"img","aria-label":t("statechart")},host);const AR=arrowDef(svg,V("muted"));
  const x=i=>40+i*((W-80)/S.length)+((W-80)/S.length-150)/2,idx=Object.fromEntries(S.map((s,i)=>[s.id,i]));
  S.forEach((s,i)=>{el("rect",{x:x(i),y:95,width:150,height:50,rx:25,fill:s.color||V("soft"),opacity:.9},svg);el("text",{x:x(i)+75,y:125,"text-anchor":"middle","font-size":14,"font-weight":700,fill:"#fff"},svg,tx(s.label)||s.id)});
  const used={};m.transitions.forEach(tr=>{const a=idx[tr.from],b=idx[tr.to],k=used[a+"-"+b]=(used[a+"-"+b]||0)+1,up=k%2===1,lvl=Math.ceil(k/2);const x1=x(a)+(b>a?150:0),x2=x(b)+(b>a?0:150),y=up?95:145,dy=(up?-1:1)*(28+lvl*20);
    el("path",{d:`M${x1-(b>a?30:-30)},${y} C${x1},${y+dy} ${x2},${y+dy} ${x2+(b>a?30:-30)},${y+(up?-2:2)}`,fill:"none",stroke:V("muted"),"stroke-width":1.4,"marker-end":AR},svg);
    el("text",{x:(x1+x2)/2,y:y+dy+(up?-4:12),"text-anchor":"middle","font-size":12,fill:V("ink")},svg,(tx(tr.label)||"")+(tr.type==="contact"?t("contact"):""))});
  return{}}
function renderStruct(){const m=model(),mt=METHOD[m.method];$("#method").innerHTML=`<b>${esc(t("modelSuffix",t(mt[0])))}</b><span>${esc(t(mt[2]))} <span class="status">${esc(t("anyl",t(mt[1])))}</span></span>`;
  const d=$("#diagram");if(m.method==="des")desSvg(d,m,false);else if(m.method==="sd")sdSvg(d,m,false);else abmSvg(d,m);
  $("#ptable").innerHTML=`<table><thead><tr><th>${t("params")}</th><th>${t("dflt")}</th><th>${t("rangeH")}</th></tr></thead><tbody>${(m.params||[]).map(p=>`<tr><td>${esc(tx(p.label))}</td><td class="n">${esc(withUnit(fmt(+p.value),p.unit))}</td><td class="n">${p.min!=null?fmt(+p.min)+" ~ "+fmt(+p.max):"—"}</td></tr>`).join("")}</tbody></table>`;
  const li=a=>(a.length?a:[t("none")]).map(s=>`<li>${esc(s)}</li>`).join("");
  $("#assume").innerHTML=`<div><h3>${t("assume")}</h3><ul>${li(txl(m.assumptions))}</ul></div><div><h3>${t("notIn")}</h3><ul>${li(txl(m.limits))}</ul></div>`}

/* ---------- animation ---------- */
let refs=null,canvas=null,pts=null;
function buildStage(){const m=model(),st=$("#stage");const n=(res.anim||res.t).length;$("#scrub").max=n-1;frame=Math.min(frame,n-1);
  if(m.method==="des")refs=desSvg(st,m,true);else if(m.method==="sd")refs=sdSvg(st,m,true);
  else{st.innerHTML="";canvas=document.createElement("canvas");const N=res.N,cols=Math.ceil(Math.sqrt(N*2.2)),rows=Math.ceil(N/cols),sz=Math.max(5,Math.min(14,Math.floor(760/cols)));canvas.width=cols*sz*2;canvas.height=(rows*sz+46)*2;canvas.style.width=cols*sz+"px";st.appendChild(canvas);
    pts={cols,sz,N};const r=(i=>{let a=i*2654435761>>>0;return()=>((a=Math.imul(a^a>>>13,1274126177)>>>0)/4294967296)});pts.j=[];for(let i=0;i<N;i++){const q=r(i+1);pts.j.push([(q()-.5)*sz*.5,(q()-.5)*sz*.5])}}
  const c=chartDefs()[0];chart($("#stageChart"),{title:c.title,t:res.t,h:200,cursor:0,lines:c.vars.filter(v=>res.series[v]).map(v=>Object.assign({label:label(v),color:color(v)},{mean:m.method==="sd"?res.series[v].mean:(res.anim&&m.method==="abm"?res.anim.map(s=>s.s.reduce((a,x)=>a+(m.states[x].id===v),0)):runOne(v))}))});
  drawFrame()}
function runOne(v){if(!res.anim)return res.series[v].mean;const m=model();if(v==="inSys"||!v.startsWith("q_"))return res.series[v].mean;const svc=m.blocks.filter(b=>b.type==="service").map(b=>"q_"+b.id),i=svc.indexOf(v);return res.anim.map(s=>s.q[i])}
function drawFrame(){if(!res)return;const m=model(),n=(res.anim||res.t).length;frame=Math.max(0,Math.min(frame,n-1));const tm=res.t[frame];$("#scrub").value=frame;
  $("#clock").textContent=t("clock",fmt(tm,tm<10?1:0),unit(),fmt(res.t[n-1],0));const ch=$("#stageChart");if(ch._cursor)ch._cursor(tm);
  if(m.method==="des"){const s=res.anim[frame],svc=m.blocks.filter(b=>b.type==="service"),dl=m.blocks.filter(b=>b.type==="delay"),src=m.blocks.filter(b=>b.type==="source"),snk=m.blocks.filter(b=>b.type==="sink");
    svc.forEach((b,i)=>{const r=refs[b.id];r.slots.forEach((e,k)=>e.setAttribute("fill",k<s.b[i]?V("accent"):V("soft")));const q=s.q[i];r.dots.forEach((e,k)=>e.setAttribute("opacity",k<q?1:0));r.qt.textContent=t("busyQ",s.b[i],r.cap,q)+(q>14?t("only14"):"")});
    dl.forEach((b,i)=>refs[b.id].t.textContent=t("ppl",s.d[i]));src.forEach((b,i)=>refs[b.id].t.textContent=t("arrived",s.made[i]));snk.forEach((b,i)=>refs[b.id].t.textContent=t("done",s.out[i])+(i===0&&s.lost?t("lost",s.lost):""));
    m.blocks.filter(b=>b.type==="select").forEach(b=>refs[b.id].t.textContent="")}
  else if(m.method==="sd"){(m.stocks).forEach(s=>{const ser=res.series[s.id].mean,mx=Math.max(...ser.map(Math.abs))||1,v=ser[frame],h=Math.max(0,v/mx*166),r=refs.stocks[s.id];r.fill.setAttribute("y",238-h);r.fill.setAttribute("height",h);r.t.textContent=withUnit(fmt(v),s.unit)});
    (m.flows||[]).forEach(f=>{refs.flows[f.id].textContent=fmt(res.series[f.id].mean[frame])+" / "+unit()})}
  else{const ctx=canvas.getContext("2d"),s=res.anim[frame].s,{cols,sz}=pts,cs=getComputedStyle(document.documentElement);ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let i=0;i<s.length;i++){const x=(i%cols)*sz+sz/2+pts.j[i][0],y=Math.floor(i/cols)*sz+sz/2+pts.j[i][1];ctx.fillStyle=m.states[s[i]].color||"#888";ctx.beginPath();ctx.arc(x,y,sz*.36,0,6.283);ctx.fill()}
    const cnt=m.states.map((_,k)=>s.reduce((a,x)=>a+(x===k),0)),y0=Math.ceil(s.length/cols)*sz+30;let x=4;ctx.font="13px "+cs.getPropertyValue("--f-body");ctx.textBaseline="alphabetic";
    m.states.forEach((st,k)=>{ctx.fillStyle=st.color||"#888";ctx.beginPath();ctx.arc(x+6,y0-4,6,0,6.283);ctx.fill();ctx.fillStyle=cs.getPropertyValue("--ink");const lb=`${tx(st.label)} ${cnt[k]}`;ctx.fillText(lb,x+16,y0);x+=ctx.measureText(lb).width+36})}}
function tick(ts){if(!playing)return;const dtp=(ts-(lastTs||ts))/1000;lastTs=ts;const n=(res.anim||res.t).length;acc+=dtp*(+$("#speed").value)*(n/15);while(acc>=1){frame++;acc--}if(frame>=n-1){frame=n-1;drawFrame();pause();return}drawFrame();raf=requestAnimationFrame(tick)}
function play(){const n=(res.anim||res.t).length;if(frame>=n-1)frame=0;playing=true;lastTs=0;acc=0;$("#play").textContent=t("pause");raf=requestAnimationFrame(tick)}
function pause(){playing=false;cancelAnimationFrame(raf);const b=$("#play");if(b)b.textContent=t("play")}
$("#play").onclick=()=>playing?pause():play();$("#scrub").oninput=e=>{pause();frame=+e.target.value;drawFrame()};

/* ---------- feedback ---------- */
(function(){const ta=$("#fbText"),st=$("#fbStatus"),list=$("#fbList");let db=null;const KEY="sim-feedback";
  const local=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}};
  const draw=items=>{list.innerHTML=items.map(i=>`<li><small>${esc(new Date(i.at).toLocaleString(LANG==="en"?"en-US":"zh-CN",{hour12:false}))} · ${esc(i.model||"")}</small><div>${esc(i.text)}</div></li>`).join("")};draw(local());
  if(window.claude&&window.claude.use)window.claude.use("db").then(d=>{if(!d)return;db=d;db.collection("feedback").orderBy("at","desc").limit(50).onSnapshot(s=>draw(s.docs.map(x=>x.data()||{})),()=>{})}).catch(()=>{});
  $("#fbSend").onclick=async()=>{const text=ta.value.trim();if(!text){st.textContent=t("writeFirst");return}const item={text,at:Date.now(),model:tx(model().title),lang:LANG,params:Object.assign({},P)};
    if(db){try{await db.collection("feedback").add(item);ta.value="";st.textContent=t("savedCloud");return}catch(e){st.textContent=t("cloudFail")}}
    const xs=[item,...local()];try{localStorage.setItem(KEY,JSON.stringify(xs))}catch(e){}draw(xs);ta.value="";if(!db)st.textContent=t("savedLocal")};
  $("#fbCopy").onclick=()=>{const tt=ta.value.trim()||local().map(i=>i.model+": "+i.text).join("\n---\n");const no=()=>{ta.value=tt;ta.select();st.textContent=t("selected")};if(navigator.clipboard)navigator.clipboard.writeText(tt).then(()=>st.textContent=t("copied"),no);else no()};
})();

applyLang();
if(!M.length){document.querySelector("main").innerHTML=`<p style="padding:40px">${esc(t("noData"))}</p>`;return}
load();show("anim");
})();
